[project]
name = "wpi-ds551-fall26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.15"
dependencies = [
    "autorom[accept-rom-license]>=0.6.1",
    "gymnasium[atari]==1.2.2",
    "ipywidgets>=8.1.9",
    "opencv-python>=5.0.0.93",
    "pygame>=2.6.1",
    "pynose==1.5.5",
    "ray[rllib]>=2.59.0",
    "torch==2.2.1",
    "torchaudio==2.2.1",
    "torchvision==0.17.1",
    "tqdm>=4.70.1",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
